name: Claude BugBot

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  bugbot:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4
      - uses: rekpero/claude-bugbot-github-action@main
        with:
          claude-setup-token: ${{ secrets.CLAUDE_SETUP_TOKEN }}
          # model: sonnet        # sonnet (default) | opus | haiku
          # max-budget: "1.00"   # max USD spend per run
          # github-token: ${{ secrets.GH_PAT }}   # optional: auto-resolve fixed threads
