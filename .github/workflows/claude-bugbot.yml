name: Claude BugBot

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  bugbot:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    env:
      CLAUDE_SETUP_TOKEN: ${{ secrets.CLAUDE_SETUP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # Skip (green) when the token isn't configured instead of failing every PR.
      # Once the CLAUDE_SETUP_TOKEN secret is set in repo settings, the review runs normally.
      - uses: rekpero/claude-bugbot-github-action@main
        if: ${{ env.CLAUDE_SETUP_TOKEN != '' }}
        with:
          claude-setup-token: ${{ secrets.CLAUDE_SETUP_TOKEN }}
          # model: sonnet        # sonnet (default) | opus | haiku
          # max-budget: "1.00"   # max USD spend per run
          # github-token: ${{ secrets.GH_PAT }}   # optional: auto-resolve fixed threads
