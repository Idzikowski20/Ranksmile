name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: test
      CI: true
      SENTRY_ENABLED: 'false'
      NEXT_PUBLIC_SENTRY_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run dead:exports
      - run: npm run typecheck
      - run: npm run test:ci
      - run: npm run build
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          NEON_AUTH_BASE_URL: https://example.invalid
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          SENTRY_ENABLED: 'false'
          NEXT_PUBLIC_SENTRY_ENABLED: 'false'
      - run: npm run budget
        continue-on-error: false

  e2e:
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
      ENABLE_KOALA_GALLERY: '1'
      SENTRY_ENABLED: 'false'
      NEXT_PUBLIC_SENTRY_ENABLED: 'false'
      PLAYWRIGHT_NO_SERVER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          NEON_AUTH_BASE_URL: https://example.invalid
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          ENABLE_KOALA_GALLERY: '1'
      - name: Start server
        run: |
          npx next start -p 3000 &
          npx wait-on http://127.0.0.1:3000 --timeout 120000
        env:
          ENABLE_KOALA_GALLERY: '1'
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          NEON_AUTH_BASE_URL: https://example.invalid
          NEXT_PUBLIC_APP_URL: http://localhost:3000
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          ENABLE_KOALA_GALLERY: '1'

  visual:
    needs: [e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      ENABLE_KOALA_GALLERY: '1'
      SENTRY_ENABLED: 'false'
      NEXT_PUBLIC_SENTRY_ENABLED: 'false'
      PLAYWRIGHT_NO_SERVER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          NEON_AUTH_BASE_URL: https://example.invalid
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          ENABLE_KOALA_GALLERY: '1'
      - name: Start server
        run: |
          npx next start -p 3000 &
          npx wait-on http://127.0.0.1:3000 --timeout 120000
        env:
          ENABLE_KOALA_GALLERY: '1'
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          NEON_AUTH_BASE_URL: https://example.invalid
          NEXT_PUBLIC_APP_URL: http://localhost:3000
      - run: npm run test:visual
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          ENABLE_KOALA_GALLERY: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diffs
          path: |
            test-results/
            playwright-report/
          retention-days: 14
