name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      # redis-memory-server's postinstall compiles Redis from source and fails on
      # the Linux runner. It is only used by scripts/dev-redis.ts (a local dev
      # helper), never by the tests or the build, so skip the download.
      - name: Install
        run: npm ci
        env:
          REDISMS_DISABLE_POSTINSTALL: '1'

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:ci

      # Verified to succeed without .env.local: every page is static or
      # server-rendered at runtime, so nothing touches the database at build time.
      - name: Build
        run: npm run build
