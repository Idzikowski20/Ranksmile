# Dev runner — `npm run dev` opens this multi-process TUI.
# Switch panes with ↑/↓ (or j/k), scroll logs, restart with `r`, quit with `q`.
procs:
  app:
    shell: "npm run dev:next"
  python-sidecar:
    cwd: "python-sidecar"
    shell: "python -m uvicorn main:app --host 127.0.0.1 --port 8001 --reload"
